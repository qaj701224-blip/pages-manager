name: CI

# Platform CI only. Generated user-site PRs under sites/** are validated by Site Check.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]
    paths-ignore:
      - 'sites/**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect platform changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          platform_changed=true
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
            echo "$changed"
            if [[ -n "$changed" ]] && ! grep -Ev '^(sites/|$)' <<<"$changed" >/dev/null; then
              platform_changed=false
            fi
          fi
          echo "platform_changed=$platform_changed" >> "$GITHUB_OUTPUT"

      - name: Skip platform CI for user-site-only changes
        if: steps.changes.outputs.platform_changed != 'true'
        run: echo "User-site-only PR; Site Check owns validation."

      - uses: pnpm/action-setup@v6
        if: steps.changes.outputs.platform_changed == 'true'
        with:
          version: 9.15.0

      - uses: actions/setup-node@v6
        if: steps.changes.outputs.platform_changed == 'true'
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - if: steps.changes.outputs.platform_changed == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.changes.outputs.platform_changed == 'true'
        run: pnpm lint
      - if: steps.changes.outputs.platform_changed == 'true'
        run: pnpm test
