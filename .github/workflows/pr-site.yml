name: Site Check

# Personal site PR guard only. Platform code PRs are validated by PR Classify and Platform CI.
on:
  pull_request:
    paths:
      - sites/**

permissions:
  contents: read
  pull-requests: read

jobs:
  site-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate site-only change
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          base="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")"
          head="$PR_HEAD_SHA"

          changed="$(git diff --name-only "$base" "$head")"
          echo "$changed"
          if echo "$changed" | grep -Ev '^(sites/[^/]+/[^/]+/|$)' >/tmp/non-site-paths; then
            echo "Site Check only accepts personal site PRs. Split PageManager platform changes into a separate PR:" >&2
            cat /tmp/non-site-paths >&2
            exit 1
          fi
          site_roots="$(echo "$changed" | awk -F/ '$1 == "sites" { print $1 "/" $2 "/" $3 }' | sort -u)"
          count="$(echo "$site_roots" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [[ "$count" != "1" ]]; then
            echo "PR must modify exactly one site root" >&2
            echo "$site_roots" >&2
            exit 1
          fi
          echo "SITE_ROOT=$site_roots" >> "$GITHUB_ENV"

      - name: Placeholder schema check
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SITE_ROOT:-}"
          manifest="$SITE_ROOT/site.json"
          if [[ ! -f "$manifest" ]]; then
            echo "Site Check requires $manifest" >&2
            exit 1
          fi
          while IFS= read -r file; do
            echo "$file"
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$file"
          done < <(find "$SITE_ROOT" -maxdepth 2 -path '*/site.json' -type f)
