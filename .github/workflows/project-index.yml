name: Project Index

on:
  workflow_dispatch:
    inputs:
      publishingJobId:
        description: PublishingJob id
        required: true
        type: string
      siteProjectId:
        description: SiteProject id
        required: false
        type: string
      allowedPath:
        description: Allowed site path
        required: true
        type: string
      callbackUrl:
        description: Gateway callback URL
        required: true
        type: string
      issueNumber:
        description: GitHub issue number
        required: false
        type: string

permissions:
  contents: read

jobs:
  project-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build placeholder project index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .pages-artifacts
          cat > .pages-artifacts/project-index.json <<JSON
          {
            "publishingJobId": "${{ inputs.publishingJobId }}",
            "siteProjectId": "${{ inputs.siteProjectId }}",
            "allowedPath": "${{ inputs.allowedPath }}",
            "issueNumber": "${{ inputs.issueNumber }}",
            "headSha": "${{ github.sha }}",
            "indexSnapshotId": "idxsnap_${{ github.run_id }}"
          }
          JSON

      - uses: actions/upload-artifact@v4
        with:
          name: project-index
          path: .pages-artifacts/project-index.json

      - name: Print callback payload
        shell: bash
        run: |
          set -euo pipefail
          cat .pages-artifacts/project-index.json
          cat > .pages-artifacts/callback.json <<JSON
          {
            "publishingJobId": "${{ inputs.publishingJobId }}",
            "workflowName": "project-index.yml",
            "workflowRunId": "${{ github.run_id }}",
            "status": "succeeded",
            "stageResult": "index_ready",
            "indexSnapshotId": "idxsnap_${{ github.run_id }}"
          }
          JSON
          cat .pages-artifacts/callback.json

      - name: Callback gateway
        shell: bash
        env:
          PAGES_CALLBACK_URL: ${{ inputs.callbackUrl }}
          PAGES_CALLBACK_TOKEN: ${{ secrets.PAGES_CALLBACK_TOKEN }}
        run: node scripts/post-executor-callback.js .pages-artifacts/callback.json

      - name: Callback gateway on failure
        if: ${{ failure() }}
        shell: bash
        env:
          PAGES_CALLBACK_URL: ${{ inputs.callbackUrl }}
          PAGES_CALLBACK_TOKEN: ${{ secrets.PAGES_CALLBACK_TOKEN }}
        run: |
          set -euo pipefail
          headers=(-H 'Content-Type: application/json')
          if [[ -n "${PAGES_CALLBACK_TOKEN:-}" ]]; then
            headers+=(-H "X-Pages-Callback-Token: $PAGES_CALLBACK_TOKEN")
          fi
          curl -fsS -X POST "$PAGES_CALLBACK_URL" "${headers[@]}" -d @- <<JSON
          {
            "publishingJobId": "${{ inputs.publishingJobId }}",
            "workflowName": "project-index.yml",
            "workflowRunId": "${{ github.run_id }}",
            "status": "failed",
            "errorCode": "PROJECT_INDEX_FAILED",
            "errorMessage": "project-index.yml failed before producing an index snapshot"
          }
          JSON
