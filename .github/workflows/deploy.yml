name: Deploy Production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Generate Wrangler config
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ZONE_ID_NEW: ${{ secrets.CF_ZONE_ID_NEW }}
          SITES_KV_NAMESPACE_ID: ${{ secrets.SITES_KV_NAMESPACE_ID }}
          IP_ALLOWLIST: ${{ vars.IP_ALLOWLIST }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID is required}"
          : "${CF_ZONE_ID_NEW:?CF_ZONE_ID_NEW is required}"
          : "${SITES_KV_NAMESPACE_ID:?SITES_KV_NAMESPACE_ID is required}"
          : "${IP_ALLOWLIST:?IP_ALLOWLIST is required}"
          cat > server/wrangler.toml <<EOF
          name = "pages-manager"
          main = "src/index.js"
          compatibility_date = "2025-05-01"
          account_id = "${CLOUDFLARE_ACCOUNT_ID}"
          workers_dev = true

          [vars]
          CF_ACCOUNT_ID = "${CLOUDFLARE_ACCOUNT_ID}"
          PAGES_MANAGER_WORKER_NAME = "pages-manager"
          PUBLIC_ENVIRONMENT = "production"
          PUBLIC_API_BASE = "https://api.workers.xd.team"
          PUBLIC_MANAGER_DEV_BASE = "https://pages-manager.xd-cf-2022.workers.dev"
          DOMAIN_BASE = "workers.xd.team"
          DOMAIN_LABEL = ""
          WORKER_PREFIX = "pages-"
          WORKERS_DEV_SUBDOMAIN = "xd-cf-2022"
          CF_ZONE_ID_NEW = "${CF_ZONE_ID_NEW}"
          IP_ALLOWLIST = "${IP_ALLOWLIST}"

          [[rules]]
          type = "Text"
          globs = ["**/*.md"]
          fallthrough = true

          [[kv_namespaces]]
          binding = "SITES"
          id = "${SITES_KV_NAMESPACE_ID}"

          [[routes]]
          pattern = "api.workers.xd.team"
          custom_domain = true
          EOF

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          command: deploy
