name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      component:
        description: Deploy component
        required: true
        type: choice
        default: all
        options:
          - all
          - server

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_COMPONENT: ${{ github.event_name == 'workflow_dispatch' && inputs.component || 'all' }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test

      - name: Generate Server Wrangler config
        if: env.DEPLOY_COMPONENT == 'all' || env.DEPLOY_COMPONENT == 'server'
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITES_KV_NAMESPACE_ID: ${{ secrets.SITES_KV_NAMESPACE_ID }}
          IP_ALLOWLIST: ${{ vars.IP_ALLOWLIST }}
          HOSTNAME_CLAIMS_MODE: enforce
        run: scripts/gen-wrangler.sh apps/server production

      - name: Validate Server secrets
        if: env.DEPLOY_COMPONENT == 'all' || env.DEPLOY_COMPONENT == 'server'
        shell: bash
        env:
          CF_ZONE_ID_NEW: ${{ secrets.CF_ZONE_ID_NEW }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          : "${CF_ZONE_ID_NEW:?CF_ZONE_ID_NEW is required}"
          : "${CF_API_TOKEN:?CF_API_TOKEN is required}"

      - name: Deploy Worker
        if: env.DEPLOY_COMPONENT == 'all' || env.DEPLOY_COMPONENT == 'server'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --dir apps/server run deploy

      - name: Inject Worker secrets
        if: env.DEPLOY_COMPONENT == 'all' || env.DEPLOY_COMPONENT == 'server'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ZONE_ID_NEW: ${{ secrets.CF_ZONE_ID_NEW }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$CF_ZONE_ID_NEW" | pnpm --dir apps/server exec wrangler secret put CF_ZONE_ID_NEW
          printf '%s' "$CF_API_TOKEN" | pnpm --dir apps/server exec wrangler secret put CF_API_TOKEN
