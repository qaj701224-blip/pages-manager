name: Probe WFP VPC Binding

# 临时诊断 workflow — 仅手动触发,验证 WFP user worker 带 vpc_network binding 上传时 Cloudflare 的行为。
# 只对选定环境的 dispatch namespace 上传 / 删除临时探测 worker(vpc-probe-*,无路由指向),不部署真实 Worker、不改任何路由。
# 对 production 必须同时选 environment=production 且勾选 allow_production,双重确认防误触。
# 定位完成后应删除本 workflow 和 scripts/probe-wfp-vpc-binding.mjs。

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 目标环境
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production
      allow_production:
        description: 对 production 跑时必须勾选(environment=staging 时忽略)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: probe-wfp-vpc-binding
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0

      - name: Probe vpc_network binding upload
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_USER_WORKER_VPC_TUNNEL_ID: ${{ vars.PAGES_USER_WORKER_VPC_TUNNEL_ID }}
          TARGET_ENV: ${{ inputs.environment }}
          ALLOW_PRODUCTION: ${{ inputs.allow_production }}
        run: |
          if [ "$TARGET_ENV" = "production" ]; then
            NS="xd-cell-workers-production"
          else
            NS="xd-cell-workers-staging"
          fi
          EXTRA=""
          if [ "$ALLOW_PRODUCTION" = "true" ]; then
            EXTRA="--allow-production"
          fi
          node scripts/probe-wfp-vpc-binding.mjs "$NS" $EXTRA
