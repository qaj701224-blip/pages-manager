name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      component:
        description: Deploy component
        required: true
        type: choice
        default: all
        options:
          - all
          - server
          - kv-gateway
  push:
    branches: [staging]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      DEPLOY_COMPONENT: ${{ github.event_name == 'workflow_dispatch' && inputs.component || 'all' }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test

      - name: Generate Server Wrangler config
        if: env.DEPLOY_COMPONENT == 'all' || env.DEPLOY_COMPONENT == 'server'
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITES_KV_NAMESPACE_ID: ${{ secrets.SITES_KV_NAMESPACE_ID }}
          IP_ALLOWLIST: ${{ vars.IP_ALLOWLIST }}
          PAGES_CAP_JWT_ACTIVE_KID: ${{ vars.PAGES_CAP_JWT_ACTIVE_KID }}
          PAGES_CAP_JWT_KEYS: ${{ vars.PAGES_CAP_JWT_KEYS }}
        run: scripts/gen-wrangler.sh apps/server staging

      - name: Generate KV Gateway Wrangler config
        if: env.DEPLOY_COMPONENT == 'all' || env.DEPLOY_COMPONENT == 'kv-gateway'
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_DATA_KV_NAMESPACE_ID: ${{ secrets.SITE_DATA_KV_NAMESPACE_ID }}
          PAGES_CAP_JWT_ACTIVE_KID: ${{ vars.PAGES_CAP_JWT_ACTIVE_KID }}
          PAGES_CAP_JWT_KEYS: ${{ vars.PAGES_CAP_JWT_KEYS }}
        run: scripts/gen-wrangler.sh apps/kv-gateway staging

      - name: Validate Server secrets
        if: env.DEPLOY_COMPONENT == 'all' || env.DEPLOY_COMPONENT == 'server'
        shell: bash
        env:
          CF_ZONE_ID_NEW: ${{ secrets.CF_ZONE_ID_NEW }}
          RUNTIME_CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAGES_CAP_JWT_SECRET_202606: ${{ secrets.PAGES_CAP_JWT_SECRET_202606 }}
        run: |
          set -euo pipefail
          : "${CF_ZONE_ID_NEW:?CF_ZONE_ID_NEW is required}"
          : "${RUNTIME_CF_API_TOKEN:?RUNTIME_CF_API_TOKEN is required}"
          : "${PAGES_CAP_JWT_SECRET_202606:?PAGES_CAP_JWT_SECRET_202606 is required}"

      - name: Validate KV Gateway secrets
        if: env.DEPLOY_COMPONENT == 'all' || env.DEPLOY_COMPONENT == 'kv-gateway'
        shell: bash
        env:
          PAGES_CAP_JWT_SECRET_202606: ${{ secrets.PAGES_CAP_JWT_SECRET_202606 }}
        run: |
          set -euo pipefail
          : "${PAGES_CAP_JWT_SECRET_202606:?PAGES_CAP_JWT_SECRET_202606 is required}"

      - name: Deploy KV Gateway
        if: env.DEPLOY_COMPONENT == 'all' || env.DEPLOY_COMPONENT == 'kv-gateway'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --dir apps/kv-gateway exec wrangler deploy

      - name: Inject KV Gateway secrets
        if: env.DEPLOY_COMPONENT == 'all' || env.DEPLOY_COMPONENT == 'kv-gateway'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_CAP_JWT_SECRET_202606: ${{ secrets.PAGES_CAP_JWT_SECRET_202606 }}
        run: |
          set -euo pipefail
          printf '%s' "$PAGES_CAP_JWT_SECRET_202606" | pnpm --dir apps/kv-gateway exec wrangler secret put PAGES_CAP_JWT_SECRET_202606

      - name: Deploy Worker
        if: env.DEPLOY_COMPONENT == 'all' || env.DEPLOY_COMPONENT == 'server'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --dir apps/server exec wrangler deploy

      - name: Inject Worker secrets
        if: env.DEPLOY_COMPONENT == 'all' || env.DEPLOY_COMPONENT == 'server'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ZONE_ID_NEW: ${{ secrets.CF_ZONE_ID_NEW }}
          RUNTIME_CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAGES_CAP_JWT_SECRET_202606: ${{ secrets.PAGES_CAP_JWT_SECRET_202606 }}
        run: |
          set -euo pipefail
          printf '%s' "$CF_ZONE_ID_NEW" | pnpm --dir apps/server exec wrangler secret put CF_ZONE_ID_NEW
          printf '%s' "$RUNTIME_CF_API_TOKEN" | pnpm --dir apps/server exec wrangler secret put CF_API_TOKEN
          printf '%s' "$PAGES_CAP_JWT_SECRET_202606" | pnpm --dir apps/server exec wrangler secret put PAGES_CAP_JWT_SECRET_202606
