name: Pages Agent

on:
  workflow_dispatch:
    inputs:
      publishingJobId:
        description: PublishingJob id
        required: true
        type: string
      mode:
        description: Agent mode
        required: true
        default: initial
        type: choice
        options:
          - initial
          - fix
      employeeSlug:
        description: Employee slug
        required: true
        type: string
      siteSlug:
        description: Site slug
        required: true
        type: string
      allowedPath:
        description: Allowed site path
        required: true
        type: string
      indexSnapshotId:
        description: ProjectIndexSnapshot id
        required: false
        type: string
      issueNumber:
        description: GitHub issue number
        required: false
        type: string
      callbackUrl:
        description: Gateway callback URL
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pages-agent-${{ inputs.employeeSlug }}-${{ inputs.siteSlug }}
  cancel-in-progress: false

jobs:
  pages-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate allowed path
        shell: bash
        run: |
          set -euo pipefail
          expected="sites/${{ inputs.employeeSlug }}/${{ inputs.siteSlug }}"
          if [[ "${{ inputs.allowedPath }}" != "$expected" ]]; then
            echo "allowedPath must be $expected" >&2
            exit 1
          fi

      - name: Generate placeholder site patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ inputs.allowedPath }}/src" .pages-artifacts
          cat > "${{ inputs.allowedPath }}/site.json" <<JSON
          {
            "employeeSlug": "${{ inputs.employeeSlug }}",
            "siteSlug": "${{ inputs.siteSlug }}",
            "title": "${{ inputs.employeeSlug }} / ${{ inputs.siteSlug }}",
            "generatedBy": "pages-agent-placeholder"
          }
          JSON
          cat > "${{ inputs.allowedPath }}/src/index.html" <<HTML
          <!doctype html>
          <html>
            <head><meta charset="utf-8"><title>${{ inputs.employeeSlug }} / ${{ inputs.siteSlug }}</title></head>
            <body><h1>${{ inputs.employeeSlug }} / ${{ inputs.siteSlug }}</h1></body>
          </html>
          HTML
          git diff -- "${{ inputs.allowedPath }}" > .pages-artifacts/site.patch

      - name: Validate generated diff boundary
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          echo "$changed"
          if echo "$changed" | grep -Ev "^${{ inputs.allowedPath }}/|^$" >/tmp/pages-agent-non-site-paths; then
            echo "Generated patch touched paths outside ${{ inputs.allowedPath }}:" >&2
            cat /tmp/pages-agent-non-site-paths >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: candidate-patch
          path: .pages-artifacts/site.patch

      - name: Controlled commit and PR
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAGES_GITHUB_APP_TOKEN || github.token }}
        run: |
          set -euo pipefail
          branch="sites/job-${{ inputs.publishingJobId }}-${{ inputs.employeeSlug }}-${{ inputs.siteSlug }}"
          title="[pages] ${{ inputs.employeeSlug }}/${{ inputs.siteSlug }} from ${{ inputs.publishingJobId }}"

          git config user.name "pages-manager-bot"
          git config user.email "pages-manager-bot@users.noreply.github.com"
          git switch -C "$branch"
          git add "${{ inputs.allowedPath }}"
          git commit -m "chore: update ${{ inputs.employeeSlug }}/${{ inputs.siteSlug }}" || true
          git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch" || true
          git push --force-with-lease origin "HEAD:$branch"

          cat > .pages-artifacts/pr-body.md <<MD
          PublishingJob: ${{ inputs.publishingJobId }}

          Related issue: #${{ inputs.issueNumber }}

          Target: ${{ inputs.employeeSlug }}/${{ inputs.siteSlug }}
          Allowed path: ${{ inputs.allowedPath }}
          Agent mode: ${{ inputs.mode }}
          Index snapshot: ${{ inputs.indexSnapshotId }}
          MD

          if ! gh pr view "$branch" --json number --jq .number >/tmp/pages-pr-number 2>/dev/null; then
            gh pr create --head "$branch" --base "${{ github.ref_name }}" --title "$title" --body-file .pages-artifacts/pr-body.md
            gh pr view "$branch" --json number --jq .number >/tmp/pages-pr-number
          fi

          gh pr view "$branch" --json url --jq .url >/tmp/pages-pr-url
          pr_number="$(cat /tmp/pages-pr-number)"
          pr_url="$(cat /tmp/pages-pr-url)"
          echo "branchName=$branch" >> "$GITHUB_OUTPUT"
          echo "prNumber=$pr_number" >> "$GITHUB_OUTPUT"
          echo "prUrl=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Print callback payload
        shell: bash
        run: |
          mkdir -p .pages-artifacts
          cat > .pages-artifacts/callback.json <<JSON
          {
            "publishingJobId": "${{ inputs.publishingJobId }}",
            "workflowName": "pages-agent.yml",
            "workflowRunId": "${{ github.run_id }}",
            "status": "succeeded",
            "stageResult": "pr_created",
            "branchName": "${{ steps.pr.outputs.branchName }}",
            "prNumber": "${{ steps.pr.outputs.prNumber }}",
            "prUrl": "${{ steps.pr.outputs.prUrl }}",
            "issueNumber": "${{ inputs.issueNumber }}",
            "indexSnapshotId": "${{ inputs.indexSnapshotId }}"
          }
          JSON
          cat .pages-artifacts/callback.json

      - name: Callback gateway
        shell: bash
        env:
          PAGES_CALLBACK_URL: ${{ inputs.callbackUrl }}
          PAGES_CALLBACK_TOKEN: ${{ secrets.PAGES_CALLBACK_TOKEN }}
        run: node scripts/post-executor-callback.js .pages-artifacts/callback.json

      - name: Callback gateway on failure
        if: ${{ failure() }}
        shell: bash
        env:
          PAGES_CALLBACK_URL: ${{ inputs.callbackUrl }}
          PAGES_CALLBACK_TOKEN: ${{ secrets.PAGES_CALLBACK_TOKEN }}
        run: |
          set -euo pipefail
          headers=(-H 'Content-Type: application/json')
          if [[ -n "${PAGES_CALLBACK_TOKEN:-}" ]]; then
            headers+=(-H "X-Pages-Callback-Token: $PAGES_CALLBACK_TOKEN")
          fi
          curl -fsS -X POST "$PAGES_CALLBACK_URL" "${headers[@]}" -d @- <<JSON
          {
            "publishingJobId": "${{ inputs.publishingJobId }}",
            "workflowName": "pages-agent.yml",
            "workflowRunId": "${{ github.run_id }}",
            "status": "failed",
            "errorCode": "AGENT_FAILED",
            "errorMessage": "pages-agent.yml failed before creating or updating a PR"
          }
          JSON
