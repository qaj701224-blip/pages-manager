name: Pages Preview

on:
  workflow_dispatch:
    inputs:
      publishingJobId:
        description: PublishingJob id
        required: true
        type: string
      prNumber:
        description: Pull request number
        required: true
        type: string
      headSha:
        description: PR head SHA
        required: true
        type: string
      siteProjectId:
        description: SiteProject id
        required: false
        type: string
      previewHostname:
        description: Preview hostname
        required: false
        type: string
      callbackUrl:
        description: Gateway callback URL
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  pages-preview:
    runs-on: ubuntu-latest
    env:
      PUBLISHING_JOB_ID: ${{ inputs.publishingJobId }}
      PR_NUMBER: ${{ inputs.prNumber }}
      HEAD_SHA: ${{ inputs.headSha }}
      SITE_PROJECT_ID: ${{ inputs.siteProjectId }}
      PREVIEW_HOSTNAME: ${{ inputs.previewHostname }}
    steps:
      - name: Checkout trusted callback helper
        uses: actions/checkout@v6
        with:
          path: .pages-trusted

      - name: Copy trusted callback helper
        shell: bash
        run: |
          set -euo pipefail
          cp .pages-trusted/scripts/post-executor-callback.js "$RUNNER_TEMP/post-executor-callback.js"

      - name: Validate preview inputs
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$PUBLISHING_JOB_ID" =~ ^job_[A-Za-z0-9_]{1,80}$ ]]; then
            echo "publishingJobId must be a job_ id" >&2
            exit 1
          fi
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "prNumber must be numeric" >&2
            exit 1
          fi
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "headSha must be a full commit SHA" >&2
            exit 1
          fi
          if [[ -n "$PREVIEW_HOSTNAME" && ! "$PREVIEW_HOSTNAME" =~ ^[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?$ ]]; then
            echo "previewHostname contains unsupported characters" >&2
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.headSha }}
          path: preview-worktree

      - name: Build placeholder preview report
        shell: bash
        working-directory: preview-worktree
        run: |
          set -euo pipefail
          mkdir -p .pages-artifacts
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';

          const previewUrl = process.env.PREVIEW_HOSTNAME
            ? `https://${process.env.PREVIEW_HOSTNAME}`
            : `https://preview-pr-${process.env.PR_NUMBER}.example.invalid`;
          const data = {
            publishingJobId: process.env.PUBLISHING_JOB_ID,
            prNumber: process.env.PR_NUMBER,
            headSha: process.env.HEAD_SHA,
            siteProjectId: process.env.SITE_PROJECT_ID || '',
            previewUrl,
          };

          writeFileSync('.pages-artifacts/preview-report.json', `${JSON.stringify(data, null, 2)}\n`);
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: preview-report
          path: preview-worktree/.pages-artifacts/preview-report.json

      - name: Print callback payload
        shell: bash
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cat preview-worktree/.pages-artifacts/preview-report.json
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const report = JSON.parse(readFileSync('preview-worktree/.pages-artifacts/preview-report.json', 'utf8'));
          const data = {
            publishingJobId: process.env.PUBLISHING_JOB_ID,
            workflowName: 'pages-preview.yml',
            workflowRunId: process.env.WORKFLOW_RUN_ID,
            status: 'succeeded',
            stageResult: 'preview_deployed',
            previewUrl: report.previewUrl,
          };

          writeFileSync('preview-worktree/.pages-artifacts/callback.json', `${JSON.stringify(data, null, 2)}\n`);
          NODE
          cat preview-worktree/.pages-artifacts/callback.json

      - name: Callback gateway
        shell: bash
        env:
          PAGES_CALLBACK_URL: ${{ inputs.callbackUrl }}
          PAGES_CALLBACK_TOKEN: ${{ secrets.PAGES_CALLBACK_TOKEN }}
          PAGES_CALLBACK_ALLOWED_ORIGINS: ${{ vars.PAGES_CALLBACK_ALLOWED_ORIGINS }}
        run: node "$RUNNER_TEMP/post-executor-callback.js" preview-worktree/.pages-artifacts/callback.json

      - name: Callback gateway on failure
        if: ${{ failure() }}
        shell: bash
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          PAGES_CALLBACK_URL: ${{ inputs.callbackUrl }}
          PAGES_CALLBACK_TOKEN: ${{ secrets.PAGES_CALLBACK_TOKEN }}
          PAGES_CALLBACK_ALLOWED_ORIGINS: ${{ vars.PAGES_CALLBACK_ALLOWED_ORIGINS }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';

          const data = {
            publishingJobId: process.env.PUBLISHING_JOB_ID,
            workflowName: 'pages-preview.yml',
            workflowRunId: process.env.WORKFLOW_RUN_ID,
            status: 'failed',
            errorCode: 'PREVIEW_DEPLOY_FAILED',
            errorMessage: 'pages-preview.yml failed before producing a preview URL',
          };

          writeFileSync(`${process.env.RUNNER_TEMP}/pages-preview-failed.json`, `${JSON.stringify(data, null, 2)}\n`);
          NODE
          node "$RUNNER_TEMP/post-executor-callback.js" "$RUNNER_TEMP/pages-preview-failed.json"
