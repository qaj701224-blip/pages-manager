name: Deploy XD Cell Production

on:
  workflow_dispatch:
    inputs:
      component:
        description: Deploy XD Cell component
        required: true
        type: choice
        default: all
        options:
          - all
          - pages-api
          - pages-auth
          - pages-router
          - pages-kv-gateway
          - pages-console

permissions:
  contents: read

concurrency:
  group: pages-v2-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_COMPONENT: ${{ github.event_name == 'workflow_dispatch' && inputs.component || 'all' }}
      ACCESS_KEY_ACTIVE_PEPPER_ID: pepper_2026_06
      ACCESS_KEY_PEPPERS: 'pepper_2026_06:ACCESS_KEY_PEPPER_202606'
      S2S_CLIENT_KEYS: 'xdmaker:key_202607:S2S_SECRET_XDMAKER_202607'
      PAGES_SESSION_JWT_ACTIVE_KID: pages-session-2026-06
      PAGES_SESSION_JWT_KEYS: 'pages-session-2026-06:HS256:PAGES_SESSION_JWT_SECRET_202606'
      PAGES_CAP_JWT_ACTIVE_KID: pages-cap-2026-06
      PAGES_CAP_JWT_KEYS: 'pages-cap-2026-06:HS256:PAGES_CAP_JWT_SECRET_202606'
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test

      - name: Generate Pages API Wrangler config
        if: env.DEPLOY_COMPONENT == 'all' || env.DEPLOY_COMPONENT == 'pages-api'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.PAGES_V2_D1_DATABASE_ID }}
          IP_ALLOWLIST: ${{ vars.IP_ALLOWLIST }}
          PAGES_USER_WORKER_VPC_TUNNEL_ID: ${{ vars.PAGES_USER_WORKER_VPC_TUNNEL_ID }}
          ROUTE_SNAPSHOTS_KV_ID: ${{ vars.PAGES_V2_ROUTE_SNAPSHOTS_KV_ID }}
        run: node scripts/render-pages-v2-wrangler.mjs apps/pages-api production

      - name: Generate Pages Auth Wrangler config
        if: env.DEPLOY_COMPONENT == 'all' || env.DEPLOY_COMPONENT == 'pages-auth'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.PAGES_V2_D1_DATABASE_ID }}
          PAGES_USER_WORKER_VPC_TUNNEL_ID: ${{ vars.PAGES_USER_WORKER_VPC_TUNNEL_ID }}
        run: node scripts/render-pages-v2-wrangler.mjs apps/pages-auth production

      - name: Generate Pages KV Gateway Wrangler config
        if: env.DEPLOY_COMPONENT == 'all' || env.DEPLOY_COMPONENT == 'pages-kv-gateway'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SITE_DATA_KV_ID: ${{ vars.PAGES_V2_SITE_DATA_KV_ID }}
        run: node scripts/render-pages-v2-wrangler.mjs apps/kv-gateway production

      - name: Generate Pages Console Wrangler config
        if: env.DEPLOY_COMPONENT == 'all' || env.DEPLOY_COMPONENT == 'pages-console'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          IP_ALLOWLIST: ${{ vars.IP_ALLOWLIST }}
          PAGES_SESSION_JWT_ACTIVE_KID: ${{ env.PAGES_SESSION_JWT_ACTIVE_KID }}
          PAGES_SESSION_JWT_KEYS: ${{ env.PAGES_SESSION_JWT_KEYS }}
        run: node scripts/render-pages-v2-wrangler.mjs apps/pages-console production

      - name: Validate Pages API secrets
        if: env.DEPLOY_COMPONENT == 'all' || env.DEPLOY_COMPONENT == 'pages-api'
        env:
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          SLACK_PAGES_ALERT_WEBHOOK_URL: ${{ secrets.SLACK_PAGES_ALERT_WEBHOOK_URL }}
          SITE_SECRET_ENCRYPTION_KEY: ${{ secrets.SITE_SECRET_ENCRYPTION_KEY }}
          WEBHOOK_URL_ENCRYPTION_KEY: ${{ secrets.WEBHOOK_URL_ENCRYPTION_KEY }}
          XDS_OPENAI_TOKEN: ${{ secrets.XDS_OPENAI_TOKEN }}
          # Add new ACCESS_KEY_PEPPER_* mappings here when ACCESS_KEY_PEPPERS rotates.
          ACCESS_KEY_PEPPER_202606: ${{ secrets.ACCESS_KEY_PEPPER_202606 }}
          S2S_SECRET_XDMAKER_202607: ${{ secrets.S2S_SECRET_XDMAKER_202607 }}
        run: DRY_RUN=1 scripts/put-pages-v2-secrets.sh apps/pages-api

      - name: Validate Pages Auth secrets
        if: env.DEPLOY_COMPONENT == 'all' || env.DEPLOY_COMPONENT == 'pages-auth'
        env:
          SSO_CLIENT_SECRET: ${{ secrets.SSO_CLIENT_SECRET }}
          XDS_OPENAI_TOKEN: ${{ secrets.XDS_OPENAI_TOKEN }}
          # Add new PAGES_SESSION_JWT_SECRET_* mappings here when PAGES_SESSION_JWT_KEYS rotates.
          PAGES_SESSION_JWT_SECRET_202606: ${{ secrets.PAGES_SESSION_JWT_SECRET_202606 }}
        run: DRY_RUN=1 scripts/put-pages-v2-secrets.sh apps/pages-auth

      - name: Validate Pages Router secrets
        if: env.DEPLOY_COMPONENT == 'all' || env.DEPLOY_COMPONENT == 'pages-router'
        env:
          # Add new PAGES_SESSION_JWT_SECRET_* mappings here when PAGES_SESSION_JWT_KEYS rotates.
          PAGES_SESSION_JWT_SECRET_202606: ${{ secrets.PAGES_SESSION_JWT_SECRET_202606 }}
          # Add new PAGES_CAP_JWT_SECRET_* mappings here when PAGES_CAP_JWT_KEYS rotates.
          PAGES_CAP_JWT_SECRET_202606: ${{ secrets.PAGES_CAP_JWT_SECRET_202606 }}
        run: DRY_RUN=1 scripts/put-pages-v2-secrets.sh apps/pages-router

      - name: Validate Pages KV Gateway secrets
        if: env.DEPLOY_COMPONENT == 'all' || env.DEPLOY_COMPONENT == 'pages-kv-gateway'
        env:
          # Add new PAGES_CAP_JWT_SECRET_* mappings here when PAGES_CAP_JWT_KEYS rotates.
          PAGES_CAP_JWT_SECRET_202606: ${{ secrets.PAGES_CAP_JWT_SECRET_202606 }}
        run: DRY_RUN=1 scripts/put-pages-v2-secrets.sh apps/kv-gateway

      - name: Validate Pages Console secrets
        if: env.DEPLOY_COMPONENT == 'all' || env.DEPLOY_COMPONENT == 'pages-console'
        env:
          # Add new PAGES_SESSION_JWT_SECRET_* mappings here when PAGES_SESSION_JWT_KEYS rotates.
          PAGES_SESSION_JWT_SECRET_202606: ${{ secrets.PAGES_SESSION_JWT_SECRET_202606 }}
        run: DRY_RUN=1 scripts/put-pages-v2-secrets.sh apps/pages-console

      - name: Check normalized user email conflicts
        if: env.DEPLOY_COMPONENT == 'all' || env.DEPLOY_COMPONENT == 'pages-api' || env.DEPLOY_COMPONENT == 'pages-auth' || env.DEPLOY_COMPONENT == 'pages-router' || env.DEPLOY_COMPONENT == 'pages-console'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/check-pages-v2-user-email-conflicts.mjs pages-v2-metadata

      - name: Apply Pages API D1 migrations
        if: env.DEPLOY_COMPONENT == 'all' || env.DEPLOY_COMPONENT == 'pages-api' || env.DEPLOY_COMPONENT == 'pages-auth' || env.DEPLOY_COMPONENT == 'pages-router' || env.DEPLOY_COMPONENT == 'pages-console'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --dir apps/pages-api exec wrangler d1 migrations apply pages-v2-metadata --remote

      - name: Deploy Pages Auth
        if: env.DEPLOY_COMPONENT == 'all' || env.DEPLOY_COMPONENT == 'pages-auth'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --dir apps/pages-auth exec wrangler deploy

      - name: Inject Pages Auth secrets
        if: env.DEPLOY_COMPONENT == 'all' || env.DEPLOY_COMPONENT == 'pages-auth'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SSO_CLIENT_SECRET: ${{ secrets.SSO_CLIENT_SECRET }}
          XDS_OPENAI_TOKEN: ${{ secrets.XDS_OPENAI_TOKEN }}
          # Add new PAGES_SESSION_JWT_SECRET_* mappings here when PAGES_SESSION_JWT_KEYS rotates.
          PAGES_SESSION_JWT_SECRET_202606: ${{ secrets.PAGES_SESSION_JWT_SECRET_202606 }}
        run: scripts/put-pages-v2-secrets.sh apps/pages-auth

      - name: Deploy Pages API
        if: env.DEPLOY_COMPONENT == 'all' || env.DEPLOY_COMPONENT == 'pages-api'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --dir apps/pages-api exec wrangler deploy

      - name: Inject Pages API secrets
        if: env.DEPLOY_COMPONENT == 'all' || env.DEPLOY_COMPONENT == 'pages-api'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          SLACK_PAGES_ALERT_WEBHOOK_URL: ${{ secrets.SLACK_PAGES_ALERT_WEBHOOK_URL }}
          SITE_SECRET_ENCRYPTION_KEY: ${{ secrets.SITE_SECRET_ENCRYPTION_KEY }}
          WEBHOOK_URL_ENCRYPTION_KEY: ${{ secrets.WEBHOOK_URL_ENCRYPTION_KEY }}
          XDS_OPENAI_TOKEN: ${{ secrets.XDS_OPENAI_TOKEN }}
          # Add new ACCESS_KEY_PEPPER_* mappings here when ACCESS_KEY_PEPPERS rotates.
          ACCESS_KEY_PEPPER_202606: ${{ secrets.ACCESS_KEY_PEPPER_202606 }}
          S2S_SECRET_XDMAKER_202607: ${{ secrets.S2S_SECRET_XDMAKER_202607 }}
        run: scripts/put-pages-v2-secrets.sh apps/pages-api

      - name: Deploy Pages KV Gateway
        if: env.DEPLOY_COMPONENT == 'all' || env.DEPLOY_COMPONENT == 'pages-kv-gateway'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --dir apps/kv-gateway exec wrangler deploy

      - name: Inject Pages KV Gateway secrets
        if: env.DEPLOY_COMPONENT == 'all' || env.DEPLOY_COMPONENT == 'pages-kv-gateway'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # Add new PAGES_CAP_JWT_SECRET_* mappings here when PAGES_CAP_JWT_KEYS rotates.
          PAGES_CAP_JWT_SECRET_202606: ${{ secrets.PAGES_CAP_JWT_SECRET_202606 }}
        run: scripts/put-pages-v2-secrets.sh apps/kv-gateway

      - name: Compute legacy normal worker bindings
        if: env.DEPLOY_COMPONENT == 'all' || env.DEPLOY_COMPONENT == 'pages-router'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/provision-pages-v2-slots.mjs production bindings

      - name: Generate Pages Router Wrangler config
        if: env.DEPLOY_COMPONENT == 'all' || env.DEPLOY_COMPONENT == 'pages-router'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ROUTE_SNAPSHOTS_KV_ID: ${{ vars.PAGES_V2_ROUTE_SNAPSHOTS_KV_ID }}
          ROUTER_IP_ALLOWLIST_CIDRS: ${{ vars.ROUTER_IP_ALLOWLIST_CIDRS }}
        run: node scripts/render-pages-v2-wrangler.mjs apps/pages-router production

      - name: Deploy Pages Router
        if: env.DEPLOY_COMPONENT == 'all' || env.DEPLOY_COMPONENT == 'pages-router'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --dir apps/pages-router exec wrangler deploy

      - name: Inject Pages Router secrets
        if: env.DEPLOY_COMPONENT == 'all' || env.DEPLOY_COMPONENT == 'pages-router'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # Add new PAGES_SESSION_JWT_SECRET_* mappings here when PAGES_SESSION_JWT_KEYS rotates.
          PAGES_SESSION_JWT_SECRET_202606: ${{ secrets.PAGES_SESSION_JWT_SECRET_202606 }}
          # Add new PAGES_CAP_JWT_SECRET_* mappings here when PAGES_CAP_JWT_KEYS rotates.
          PAGES_CAP_JWT_SECRET_202606: ${{ secrets.PAGES_CAP_JWT_SECRET_202606 }}
        run: scripts/put-pages-v2-secrets.sh apps/pages-router

      - name: Build Pages Console assets
        if: env.DEPLOY_COMPONENT == 'all' || env.DEPLOY_COMPONENT == 'pages-console'
        run: pnpm --filter @xd-cell/pages-console build

      - name: Deploy Pages Console
        if: env.DEPLOY_COMPONENT == 'all' || env.DEPLOY_COMPONENT == 'pages-console'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --dir apps/pages-console exec wrangler deploy

      - name: Inject Pages Console secrets
        if: env.DEPLOY_COMPONENT == 'all' || env.DEPLOY_COMPONENT == 'pages-console'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # Add new PAGES_SESSION_JWT_SECRET_* mappings here when PAGES_SESSION_JWT_KEYS rotates.
          PAGES_SESSION_JWT_SECRET_202606: ${{ secrets.PAGES_SESSION_JWT_SECRET_202606 }}
        run: scripts/put-pages-v2-secrets.sh apps/pages-console
