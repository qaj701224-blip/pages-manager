name: Platform CI

# PageManager platform CI. Personal site PRs are validated by PR Classify and Site Check.
on:
  workflow_dispatch:
    inputs:
      baseSha:
        description: Optional immutable base SHA for generated site diff
        required: false
        type: string
      headSha:
        description: Optional expected head SHA for generated site diff
        required: false
        type: string
      allowedPath:
        description: Optional generated site root, for example sites/employee/site
        required: false
        type: string
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect platform changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BASE_SHA: ${{ inputs.baseSha }}
          INPUT_HEAD_SHA: ${{ inputs.headSha }}
          INPUT_ALLOWED_PATH: ${{ inputs.allowedPath }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          site_changed=false
          platform_changed=true

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            changed="$(git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA")"
            echo "$changed"

            site_changed=false
            platform_changed=false
            while IFS= read -r path; do
              [[ -z "$path" ]] && continue
              case "$path" in
                sites/*)
                  site_changed=true
                  ;;
                *)
                  platform_changed=true
                  ;;
              esac
            done <<< "$changed"

            if [[ "$site_changed" == "true" && "$platform_changed" == "true" ]]; then
              echo "Mixed PRs are not supported: split personal site changes and PageManager platform changes into separate PRs." >&2
              exit 1
            fi
            if [[ "$site_changed" == "true" && "$platform_changed" != "true" ]]; then
              platform_changed=false
            fi
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$PUSH_BEFORE_SHA" =~ ^0{40}$ ]]; then
              changed="$(git diff-tree --no-commit-id --name-only -r "$PUSH_HEAD_SHA")"
            else
              changed="$(git diff --name-only "$PUSH_BEFORE_SHA" "$PUSH_HEAD_SHA")"
            fi
            echo "$changed"
            platform_changed=true
          elif [[ "$EVENT_NAME" == "workflow_dispatch" &&
            -n "${INPUT_BASE_SHA:-}" &&
            -n "${INPUT_HEAD_SHA:-}" &&
            -n "${INPUT_ALLOWED_PATH:-}" ]]; then
            if [[ "$INPUT_BASE_SHA" =~ ^[0-9a-f]{40}$ &&
              "$INPUT_HEAD_SHA" =~ ^[0-9a-f]{40}$ &&
              "$INPUT_ALLOWED_PATH" =~ ^sites/[^/]+/[^/]+$ ]]; then
              changed="$(git diff --name-only "$INPUT_BASE_SHA" "$INPUT_HEAD_SHA")"
              echo "$changed"
              site_only=true
              site_changed=false
              platform_changed=false
              while IFS= read -r path; do
                [[ -z "$path" ]] && continue
                case "$path" in
                  "$INPUT_ALLOWED_PATH"/*)
                    site_changed=true
                    ;;
                  *)
                    platform_changed=true
                    site_only=false
                    ;;
                esac
              done <<< "$changed"
              if [[ "$site_changed" == "true" && "$platform_changed" == "true" ]]; then
                echo "Mixed PRs are not supported: split personal site changes and PageManager platform changes into separate PRs." >&2
                exit 1
              fi
              if [[ -n "$changed" && "$site_only" == "true" ]]; then
                platform_changed=false
              fi
            fi
          fi
          echo "site_changed=$site_changed" >> "$GITHUB_OUTPUT"
          echo "platform_changed=$platform_changed" >> "$GITHUB_OUTPUT"

      - name: Skip platform CI for personal-site-only changes
        if: steps.changes.outputs.platform_changed != 'true'
        run: echo "Personal-site-only PR; PR Classify and Site Check own validation."

      - uses: pnpm/action-setup@v6
        if: steps.changes.outputs.platform_changed == 'true'
        with:
          version: 9.15.0

      - uses: actions/setup-node@v6
        if: steps.changes.outputs.platform_changed == 'true'
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - if: steps.changes.outputs.platform_changed == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.changes.outputs.platform_changed == 'true'
        run: pnpm lint
      - if: steps.changes.outputs.platform_changed == 'true'
        run: pnpm test
