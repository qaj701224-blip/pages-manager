name: Audit XD Cell Legacy Normal Workers

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target XD Cell environment
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production
      reason:
        description: Optional audit reason
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pages-legacy-normal-workers-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TARGET_ENV: ${{ inputs.environment }}
      PAGES_SESSION_JWT_ACTIVE_KID: pages-session-2026-06
      PAGES_SESSION_JWT_KEYS: "pages-session-2026-06:HS256:PAGES_SESSION_JWT_SECRET_202606"
      PAGES_CAP_JWT_ACTIVE_KID: pages-cap-2026-06
      PAGES_CAP_JWT_KEYS: "pages-cap-2026-06:HS256:PAGES_CAP_JWT_SECRET_202606"
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: node --test scripts/provision-pages-v2-slots.test.js scripts/render-pages-v2-wrangler.test.js apps/pages-router/src/*.test.js

      - name: Validate target environment
        run: |
          case "$TARGET_ENV" in
            staging|production)
              ;;
            *)
              echo "Unsupported TARGET_ENV: $TARGET_ENV" >&2
              exit 2
              ;;
          esac

      - name: Compute active legacy normal worker bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/provision-pages-v2-slots.mjs "$TARGET_ENV" bindings

      - name: Generate Pages Router Wrangler config
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ROUTE_SNAPSHOTS_KV_ID: ${{ vars.PAGES_V2_ROUTE_SNAPSHOTS_KV_ID }}
          ROUTER_IP_ALLOWLIST_CIDRS: ${{ vars.ROUTER_IP_ALLOWLIST_CIDRS }}
        run: node scripts/render-pages-v2-wrangler.mjs apps/pages-router "$TARGET_ENV"

      - name: Upload audited router config
        uses: actions/upload-artifact@v4
        with:
          name: pages-router-${{ inputs.environment }}-legacy-normal-worker-audit
          path: apps/pages-router/wrangler.toml
