<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>XD Pages Data Smoke</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7f8fb;
        color: #18202f;
      }

      main {
        width: min(720px, calc(100vw - 32px));
        padding: 28px;
        border: 1px solid #d9deea;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 18px 48px rgb(28 39 64 / 10%);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        line-height: 1.2;
      }

      p {
        margin: 0 0 20px;
        color: #536079;
      }

      form {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        margin-bottom: 18px;
      }

      input,
      button {
        min-height: 40px;
        border-radius: 6px;
        font: inherit;
      }

      input {
        border: 1px solid #c8cfdd;
        padding: 0 12px;
      }

      button {
        border: 0;
        padding: 0 16px;
        color: #ffffff;
        background: #246bfe;
        cursor: pointer;
      }

      button.secondary {
        color: #25314a;
        background: #e9edf7;
      }

      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }

      pre {
        min-height: 120px;
        overflow: auto;
        margin: 0;
        padding: 14px;
        border-radius: 6px;
        background: #111827;
        color: #d7e2ff;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>XD Pages Data Smoke</h1>
      <p>This page writes, reads, and deletes one JSON value through the XD Pages site data API.</p>
      <form id="data-form">
        <input id="message" name="message" value="hello from xd-pages data" autocomplete="off" />
        <button type="submit">Write data</button>
      </form>
      <div class="actions">
        <button id="read" class="secondary" type="button">Read data</button>
        <button id="delete" class="secondary" type="button">Delete data</button>
      </div>
      <pre id="log" aria-live="polite">Ready.</pre>
    </main>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
