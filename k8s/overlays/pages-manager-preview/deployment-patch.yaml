apiVersion: apps/v1
kind: Deployment
metadata:
  name: pages-gateway
  namespace: pages-system
spec:
  template:
    spec:
      imagePullSecrets:
        - name: acr-credential-secret-aggregation
      containers:
        - name: pages-gateway
          imagePullPolicy: Always
          env:
            - name: INTERNAL_CALLBACK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: callback-secrets
                  key: internal-callback-token
                  optional: false
            - name: PAGES_WORKER_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: callback-secrets
                  key: pages-worker-shared-secret
                  optional: false
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: github-platform-secret
                  key: github-webhook-secret
                  optional: false
            - name: SLACK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: slack-platform-secret
                  key: slack-signing-secret
                  optional: false
            - name: SLACK_AGENT_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: slack-platform-secret
                  key: slack-agent-shared-secret
                  optional: false
            - name: SLACK_NOTIFIER_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: slack-platform-secret
                  key: slack-notifier-shared-secret
                  optional: false
            - name: MYSQL_ADDR
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: mysql-addr
                  optional: false
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: mysql-user
                  optional: false
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: mysql-password
                  optional: false
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: mysql-database
                  optional: false
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: redis-url
                  optional: false
---
