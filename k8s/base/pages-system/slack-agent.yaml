apiVersion: apps/v1
kind: Deployment
metadata:
  name: slack-agent
  namespace: pages-system
  labels:
    app.kubernetes.io/name: slack-agent
    app.kubernetes.io/part-of: pages-manager
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: slack-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: slack-agent
        app.kubernetes.io/part-of: pages-manager
    spec:
      automountServiceAccountToken: false
      serviceAccountName: pages-control-plane
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: slack-agent
          image: pages-manager/slack-agent:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 512Mi
          ports:
            - name: http
              containerPort: 8791
          envFrom:
            - configMapRef:
                name: pages-config
          env:
            - name: PORT
              value: '8791'
            - name: MYSQL_ADDR
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: mysql-addr
                  optional: true
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: mysql-user
                  optional: true
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: mysql-password
                  optional: true
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: mysql-database
                  optional: true
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: redis-url
                  optional: true
            - name: SLACK_AGENT_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: slack-platform-secret
                  key: slack-agent-shared-secret
                  optional: true
            - name: SLACK_AGENT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: model-provider-secret
                  key: slack-agent-api-key
                  optional: true
            - name: AGENT_GATEWAY_URL
              valueFrom:
                secretKeyRef:
                  name: model-provider-secret
                  key: slack-agent-gateway-url
                  optional: true
            - name: AGENT_MODEL_NAME
              valueFrom:
                secretKeyRef:
                  name: model-provider-secret
                  key: slack-agent-model-name
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: slack-agent
  namespace: pages-system
  labels:
    app.kubernetes.io/name: slack-agent
    app.kubernetes.io/part-of: pages-manager
spec:
  selector:
    app.kubernetes.io/name: slack-agent
  ports:
    - name: http
      port: 8791
      targetPort: http
