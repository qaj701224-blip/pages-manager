apiVersion: apps/v1
kind: Deployment
metadata:
  name: pages-worker
  namespace: pages-system
  labels:
    app.kubernetes.io/name: pages-worker
    app.kubernetes.io/part-of: pages-manager
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: pages-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pages-worker
        app.kubernetes.io/part-of: pages-manager
    spec:
      automountServiceAccountToken: false
      serviceAccountName: pages-control-plane
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pages-worker
          image: pages-manager/worker:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 512Mi
          ports:
            - name: http
              containerPort: 8790
          envFrom:
            - configMapRef:
                name: pages-config
          env:
            - name: PORT
              value: '8790'
            - name: MYSQL_ADDR
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: mysql-addr
                  optional: true
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: mysql-user
                  optional: true
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: mysql-password
                  optional: true
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: mysql-database
                  optional: true
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: redis-url
                  optional: true
            - name: INTERNAL_CALLBACK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: callback-secrets
                  key: internal-callback-token
                  optional: true
            - name: PAGES_WORKER_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: callback-secrets
                  key: pages-worker-shared-secret
                  optional: true
            - name: GITHUB_APP_INSTALLATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-platform-secret
                  key: github-app-installation-token
                  optional: true
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-platform-secret
                  key: github-token
                  optional: true
            - name: PAGES_PREVIEW_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-preview-secret
                  key: pages-preview-token
                  optional: true
            - name: PAGES_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-preview-secret
                  key: pages-token
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: pages-worker
  namespace: pages-system
  labels:
    app.kubernetes.io/name: pages-worker
    app.kubernetes.io/part-of: pages-manager
spec:
  selector:
    app.kubernetes.io/name: pages-worker
  ports:
    - name: http
      port: 8790
      targetPort: http
