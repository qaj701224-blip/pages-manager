apiVersion: apps/v1
kind: Deployment
metadata:
  name: slack-notifier
  namespace: pages-system
  labels:
    app.kubernetes.io/name: slack-notifier
    app.kubernetes.io/part-of: pages-manager
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: slack-notifier
  template:
    metadata:
      labels:
        app.kubernetes.io/name: slack-notifier
        app.kubernetes.io/part-of: pages-manager
    spec:
      automountServiceAccountToken: false
      serviceAccountName: pages-control-plane
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: slack-notifier
          image: pages-manager/slack-notifier:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 512Mi
          ports:
            - name: http
              containerPort: 8792
          envFrom:
            - configMapRef:
                name: pages-config
          env:
            - name: PORT
              value: '8792'
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: slack-platform-secret
                  key: slack-bot-token
                  optional: true
            - name: SLACK_NOTIFIER_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: slack-platform-secret
                  key: slack-notifier-shared-secret
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: slack-notifier
  namespace: pages-system
  labels:
    app.kubernetes.io/name: slack-notifier
    app.kubernetes.io/part-of: pages-manager
spec:
  selector:
    app.kubernetes.io/name: slack-notifier
  ports:
    - name: http
      port: 8792
      targetPort: http
