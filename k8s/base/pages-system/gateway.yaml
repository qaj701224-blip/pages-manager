apiVersion: apps/v1
kind: Deployment
metadata:
  name: pages-gateway
  namespace: pages-system
  labels:
    app.kubernetes.io/name: pages-gateway
    app.kubernetes.io/part-of: pages-manager
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: pages-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pages-gateway
        app.kubernetes.io/part-of: pages-manager
    spec:
      automountServiceAccountToken: false
      serviceAccountName: pages-control-plane
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pages-gateway
          image: pages-manager/gateway:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 512Mi
          ports:
            - name: http
              containerPort: 8788
          envFrom:
            - configMapRef:
                name: pages-config
          env:
            - name: PORT
              value: '8788'
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: database-url
                  optional: true
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: redis-url
                  optional: true
            - name: INTERNAL_CALLBACK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: callback-secrets
                  key: internal-callback-token
                  optional: true
            - name: PAGES_WORKER_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: callback-secrets
                  key: pages-worker-shared-secret
                  optional: true
            - name: SLACK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: slack-platform-secret
                  key: slack-signing-secret
                  optional: true
            - name: SLACK_AGENT_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: slack-platform-secret
                  key: slack-agent-shared-secret
                  optional: true
            - name: SLACK_NOTIFIER_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: slack-platform-secret
                  key: slack-notifier-shared-secret
                  optional: true
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: github-platform-secret
                  key: github-webhook-secret
                  optional: true
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: pages-gateway
  namespace: pages-system
  labels:
    app.kubernetes.io/name: pages-gateway
    app.kubernetes.io/part-of: pages-manager
spec:
  selector:
    app.kubernetes.io/name: pages-gateway
  ports:
    - name: http
      port: 8788
      targetPort: http
