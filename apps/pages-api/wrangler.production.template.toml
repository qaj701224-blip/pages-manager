name = "pages-api"
main = "src/index.js"
compatibility_date = "2026-06-15"
account_id = "__CLOUDFLARE_ACCOUNT_ID__"
workers_dev = false

[observability.logs]
enabled = true
head_sampling_rate = 1

[triggers]
crons = ["*/15 * * * *"]

[[routes]]
pattern = "api.pages.xd.team/*"
zone_name = "xd.team"

[vars]
PAGES_ENV = "production"
PUBLIC_API_BASE = "https://api.pages.xd.team"
PUBLIC_AUTH_BASE = "https://auth.pages.xd.team"
PUBLIC_SITE_SUFFIX = "workers.xd.team"
PAGES_EXECUTION_MODE = "wfp"
PAGES_NORMAL_WORKER_SLOT_EXPAND_BY = "2"
WFP_DISPATCH_NAMESPACE = "xd-cell-workers-production"
WFP_COMPATIBILITY_DATE = "2026-06-15"
PAGES_USER_WORKER_VPC_TUNNEL_ID = "__PAGES_USER_WORKER_VPC_TUNNEL_ID__"
SLACK_PAGES_ALERT_MENTION_USER_ID = "U06QLFY2XCK"
ACCESS_KEY_ACTIVE_PEPPER_ID = "pepper_2026_06"
ACCESS_KEY_PEPPERS = "pepper_2026_06:ACCESS_KEY_PEPPER_202606"
CLI_ACCESS_KEY_TTL_SECONDS = "31536000"
S2S_CLIENT_KEYS = "xdmaker:key_202607:S2S_SECRET_XDMAKER_202607"
IP_ALLOWLIST = "__IP_ALLOWLIST__"

# Required Worker secret:
# - SITE_SECRET_ENCRYPTION_KEY: encryption key for site-level runtime secrets.
# - WEBHOOK_URL_ENCRYPTION_KEY: encryption key for platform webhook target URLs.
# - XDS_OPENAI_TOKEN: XDS / OA org directory token for department hydration.
# - S2S_SECRET_XDMAKER_202607: shared secret for the controlled XDMaker S2S exchange.

[[d1_databases]]
binding = "PAGES_METADATA"
database_name = "pages-v2-metadata"
database_id = "__D1_DATABASE_ID__"

[[kv_namespaces]]
binding = "ROUTE_SNAPSHOTS"
id = "__ROUTE_SNAPSHOTS_KV_ID__"

[[durable_objects.bindings]]
name = "ROUTE_POINTER_LOCKS"
class_name = "RoutePointerDO"

[[services]]
binding = "PAGES_AUTH"
service = "pages-auth"

__PAGES_API_XDS_VPC_NETWORK__

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoutePointerDO"]
